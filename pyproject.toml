[project]
name = "gnucash-ofx"
version = "0.1.0"
description = "Pull bank transactions via Open Banking (Enable Banking) and Wise, emit OFX files for GnuCash import."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Leszek Ciesielski" }]
keywords = ["gnucash", "ofx", "open-banking", "psd2", "enable-banking", "wise"]
dependencies = [
    # Pinned to the exact version tested, not just bounded below 0.10 (docs/adr-combined-ofx-file.md
    # decision 3): _CombinedOfxWriter subclasses OfxWriter and depends on buildBankTransactionList
    # existing and on self.statement being re-read on every call, neither of which is part of
    # ofxstatement's public contract - a same-0.9.x patch release could change either without
    # notice. Bump deliberately, re-running the structural test in test_ofxout.py and the Windows
    # ofx-conformance check, rather than let a routine `uv sync` change the shape of every file
    # written.
    "ofxstatement==0.9.3",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pyjwt[crypto]>=2.8",
]

[project.scripts]
gnucash-ofx = "gnucash_ofx.cli:main"

[project.urls]
Homepage = "https://github.com/skolima/gnucash-ofx"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=5",
    "ofxtools>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gnucash_ofx"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.12"
packages = ["gnucash_ofx", "tools.evidence"]
mypy_path = ["src", "."]
namespace_packages = true
explicit_package_bases = true
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=gnucash_ofx --cov-report=term-missing"
pythonpath = ["src", "."]
